<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionPath | UNN Campus Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container py-4 py-md-5" style="max-width: 840px;">
        
        <!-- Professional Card Container -->
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- UNN Green Header -->
            <div class="card-header py-3 px-4 text-white d-flex align-items-center justify-content-between" style="background-color: #0d5c2e;">
                <div class="d-flex align-items-center gap-2">
                    <span style="font-size: 1.8rem;">🦁</span>
                    <div>
                        <h4 class="mb-0 fw-bold">LionPath</h4>
                        <small class="text-light opacity-75 d-flex align-items-center">
                            <span style="display: inline-block; width: 8px; height: 8px; background-color: #4cd137; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 5px #4cd137;"></span>
                            Online | Faculty of Physical Sciences, UNN
                        </small>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a href="/admin" class="btn btn-outline-light btn-sm rounded-pill px-2" title="Admin Login">
                        ⚙️
                    </a>
                </div>
            </div>
            
            <div class="card-body p-0">
                <!-- Chat Box Area -->
                <div id="chat-box" class="p-3 p-md-4" style="height: 520px; overflow-y: auto; background-color: #f8f9fa;"></div>
            </div>
            
            <div class="card-footer bg-white border-top p-3 p-md-4">
                <!-- Audio Toggle Switch -->
                <div class="form-check form-switch mb-2 ms-1">
                    <input class="form-check-input" type="checkbox" id="audioToggle">
                    <label class="form-check-label text-muted small fw-semibold" for="audioToggle">Enable Voice Responses</label>
                </div>

                <!-- Global Suggestion Chips -->
                <div class="suggestion-chips d-flex gap-2 mb-3 overflow-auto pb-1" style="scrollbar-width: none;">
                    <button class="chip btn btn-outline-secondary rounded-pill px-3 py-1 text-nowrap" data-query="How do I complete my registration?">Registration</button>
                    <button class="chip btn btn-outline-secondary rounded-pill px-3 py-1 text-nowrap" data-query="When will clearance end?">Clearance Deadline</button>
                    <button class="chip btn btn-outline-secondary rounded-pill px-3 py-1 text-nowrap" data-query="Are there any events happening today?">Events</button>
                    <button class="chip btn btn-outline-secondary rounded-pill px-3 py-1 text-nowrap" data-query="How is CGPA calculated?">CGPA Scale</button>
                    <button class="chip btn btn-outline-secondary rounded-pill px-3 py-1 text-nowrap" data-query="How do I get a hostel?">Hostel</button>
                </div>

                <!-- Input Area -->
                <div class="d-flex gap-2 align-items-center">
                    <input type="text" id="message-input" class="form-control rounded-3 px-3 py-2"
                           placeholder="Ask about directions, timetables, clearance, events..."
                           autocomplete="off" style="font-size: 1rem;">
                    
                    <!-- Circular Mic Button -->
                    <button id="mic-btn" class="btn-mic rounded-circle d-flex align-items-center justify-content-center" type="button" title="Click to speak">
                        🎤
                    </button>
                    
                    <!-- Rounded Send Button -->
                    <button id="send-btn" class="btn text-white fw-bold px-4 py-2 rounded-3" style="background-color: #0d5c2e;">Send</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
