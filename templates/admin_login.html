<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LionPath Admin | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .login-header {
            background-color: #0d5c2e;
            color: #ffffff;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
        }
        .btn-unn-green {
            background-color: #0d5c2e;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-unn-green:hover {
            background-color: #094020;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-card bg-white">
        <div class="login-header">
            <h3 class="fw-bold mb-1">🦁 LionPath</h3>
            <p class="small text-light opacity-75 mb-0">Campus Knowledge Base Administration</p>
        </div>
        
        <div class="p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label text-muted small fw-semibold">Admin Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-unn-green w-100 py-2 mb-3">Sign In</button>
            </form>

            <div class="text-center">
                <a href="/" class="text-decoration-none small text-muted">← Back to LionPath Chatbot</a>
            </div>
        </div>
    </div>
</body>
</html>
